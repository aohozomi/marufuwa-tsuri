<style>

<main id="main">

  <h1 id="title" tabindex="-1">まるふわの いりぐち</h1>

<script>
/* まるふわの いりぐち（ジョブズ2・2026-10-02）。ブラウザの つり・iPhone アプリ・LINE スタンプへの 入口。
   ・通信なし・ほぞんなし（つりびより本体の せっていは よむだけ）。外へ ひらく 2つは「いいですか？」を 出して から（リンクは その とき はじめて つく）。 */
(function () {
  'use strict';
  const LINKS = {
    app: 'https://apps.apple.com/app/apple-store/id6816003504?pt=129401810&ct=web_links&mt=8',
    line: 'https://line.me/S/sticker/36906448'
  };
  const EN = new URLSearchParams(location.search).get('lang') === 'en' || (() => { try { return localStorage.getItem('marufuwa-lang-v1') === 'en'; } catch (e) { return false; } })();
  const T = (ja, en) => EN ? en : ja;
  const $ = id => document.getElementById(id);
  const set = (id, ja, en) => { const e = $(id); if (e) e.textContent = T(ja, en); };
  document.title = T('まるふわの いりぐち｜まるふわ つりびより', 'Marufuwa’s Doorway | Marufuwa Fishing Days');
  set('skip', 'いりぐちへ とぶ', 'Skip to the links'); set('title', 'まるふわの いりぐち', 'Meet Marufuwa'); set('lead', 'まるふわに あえる ところは みっつ。すきな ところから どうぞ。', 'There are three places to meet Marufuwa. Pick any one.');
  set('t-play', 'ブラウザで あそぶ', 'Play in your browser'); set('s-play', 'つりびより・むりょう・ログインなし', 'Fishing Days · free · no login');
  set('t-app', 'iPhone アプリ', 'iPhone app'); set('s-app', 'まるふわまるいろ・むりょう', 'Marufuwa Maruiro · free');
  set('t-line', 'LINE スタンプ', 'LINE stickers'); set('s-line', 'まるふわの スタンプ', 'Marufuwa stickers');
  set('q-app', 'そとの ページ（App Store）を ひらきます。いいですか？', 'This opens an outside page (the App Store). Is that OK?'); set('q-line', 'そとの ページ（LINE ストア）を ひらきます。いいですか？', 'This opens an outside page (the LINE Store). Is that OK?');
  set('a-app', 'ひらく', 'Open'); set('a-line', 'ひらく', 'Open'); set('n-app', 'やめる', 'Cancel'); set('n-line', 'やめる', 'Cancel');
  set('a-stream', 'はいしん・どうがで つかう かたへ', 'For streamers and video makers');
  set('note', 'そとの ページを ひらく ときは かならず「いいですか？」と きくよ。この ページは なにも ほぞんしないし、どこにも おくらないよ。', 'We always ask before opening an outside page. This page saves nothing and sends nothing.');
  const say = t => { const l = $('live'); l.textContent = ''; setTimeout(() => { l.textContent = t; }, 30); };
  function close(k, focusBack) {
    const box = $('c-' + k), a = $('a-' + k), b = $('b-' + k); box.hidden = true; a.removeAttribute('href'); b.setAttribute('aria-expanded', 'false'); if (focusBack) b.focus();
  }
  function open(k) {
    ['app', 'line'].forEach(x => { if (x !== k) close(x, false); });
    const box = $('c-' + k), a = $('a-' + k), b = $('b-' + k); a.href = LINKS[k]; box.hidden = false; b.setAttribute('aria-expanded', 'true');   // リンクは「いいですか？」を 出した とき はじめて つく
    a.focus({preventScroll: false}); say($('q-' + k).textContent);
  }
  ['app', 'line'].forEach(k => {
    $('b-' + k).addEventListener('click', () => { if ($('c-' + k).hidden) open(k); else close(k, false); });
    $('n-' + k).addEventListener('click', () => close(k, true));
    $('a-' + k).addEventListener('click', () => { setTimeout(() => close(k, false), 50); });   // ひらいたら もとに もどす
    $('c-' + k).addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); close(k, true); } });
  });
})();
</script>
