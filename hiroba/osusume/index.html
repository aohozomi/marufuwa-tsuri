<script>
// つりびよりの「つかいやすく する」（もじを おおきく・うごきを へらす）と 時間帯（あさ・ひる・ゆうがた・よる）に、この へやも したがう（本体と おなじ 記録 marufuwa-tsuri-v1 を よむだけ・かきかえない）。
// 時間帯は ?time=a|h|y|n（手元の 試験用）→ 記録の time → 時計（5〜10時 あさ／10〜16時 ひる／16〜19時 ゆうがた／それ以外 よる）。
try {
  var early = JSON.parse(localStorage.getItem('marufuwa-tsuri-v1')) || {}, root = document.documentElement, q = new URLSearchParams(location.search);
  if (early.large === true) root.dataset.large = 'true';
  if (early.calm === true) root.dataset.calm = 'true';
  var tf = q.get('time'), t = /^[ahyn]$/.test(tf || '') ? tf : /^[ahyn]$/.test(early.time || '') ? early.time : null;
  if (!t) { var h = new Date().getHours(); t = h >= 5 && h < 10 ? 'a' : h >= 10 && h < 16 ? 'h' : h >= 16 && h < 19 ? 'y' : 'n'; }
  root.dataset.time = t;
} catch (e) { document.documentElement.dataset.time = 'h'; }

<main class="room" id="room">
  <div class="top"><a class="back" id="back" href="../index.html">← ひろばへ</a></div>

  <div id="shelves"></div>
  <details class="more"><summary>おうちの かたへ</summary><p class="note">そとへ ひらく ボタンは、おして「いいですか？」と かくにんした あとだけ ひらきます。この へやに、もじを いれる ところは ありません。<a class="anshin-link" href="../../anshin/">おうちの かたへ</a></p></details>
</main>
<dialog id="go" aria-labelledby="go-title">
  <h2 id="go-title">そとへ ひらきます。いいですか？</h2>
  <p class="where" id="go-where"></p>

<script src="../../tsuri-daily.js"></script>
<script>
(() => {
  'use strict';
  // ─── 棚の しゅるい（かぎ → ことば）。マスターが data/osusume.json に {kind,name,img,url,hitokoto}（＋あれば hitokoto_en）を 書く。ここに ない kind は 出さない ───
  const KINDS = [
    { k: 'illustrator', h: 'イラストレーター', sub: 'えを かく ひと', ic: '🎨' },
    { k: 'streamer', h: 'はいしんしゃ', sub: 'はいしんを して いる ひと', ic: '📺' },
    { k: 'follower', h: 'フォロワーを あつめたい ひと', sub: 'これから ひろがって いく ひと', ic: '🌱' },
    { k: 'ganbaru', h: 'がんばって いる ひと', sub: 'まいにち こつこつ すすんで いる ひと', ic: '🔥' }
  ];
  const MAX_PER_SHELF = 12, DATA = '../../data/osusume.json', IMG = '../../img/osusume/';
  const shelves = document.getElementById('shelves'), live = document.getElementById('live'), dlg = document.getElementById('go'), where = document.getElementById('go-where'), open = document.getElementById('go-open'), cancel = document.getElementById('go-cancel');
  const isEn = () => !!(window.TsuriEn && window.TsuriEn.lang === 'en');
  // ─── 入ってきた ものを うたがう：しゅるい・長さ・https だけ・絵は この ゲームの img/osusume/ の ファイル名だけ（外の 画像は 読まない）───
  const okText = (s, max) => typeof s === 'string' && s.length > 0 && s.length <= max && !/[\u0000-\u001f\u007f<>]/.test(s);
  function cleanUrl(u) {
    if (typeof u !== 'string' || u.length > 300) return null;
    let x; try { x = new URL(u); } catch (e) { return null; }
    if (x.protocol !== 'https:' || x.username || x.password || !/^[a-z0-9.-]+\.[a-z]{2,}$/i.test(x.hostname) || x.hostname.length > 120) return null;
    return x;
  }
  function clean(list) {
    const out = KINDS.map(() => []);
    if (!Array.isArray(list)) return out;
    for (const e of list.slice(0, 200)) {
      if (!e || typeof e !== 'object') continue;
      const ki = KINDS.findIndex(x => x.k === e.kind); if (ki < 0 || out[ki].length >= MAX_PER_SHELF) continue;
      const url = cleanUrl(e.url); if (!url || !okText(e.name, 40)) continue;
      const hito = e.hitokoto === undefined || e.hitokoto === '' ? '' : (okText(e.hitokoto, 80) ? e.hitokoto : null); if (hito === null) continue;
      const hitoEn = typeof e.hitokoto_en === 'string' && okText(e.hitokoto_en, 160) ? e.hitokoto_en : '';
      const img = typeof e.img === 'string' && /^[a-z0-9][a-z0-9_-]{0,40}\.(webp|png|jpg|jpeg)$/i.test(e.img) ? e.img : '';
      out[ki].push({ name: e.name, hito, hitoEn, img, url: url.href, host: url.hostname });
    }
    return out;
  }
  // ─── へやに いる ひと（kind:'resident'＝月城ノア など）：外へ ひらく ボタンは ない。絵（この フォルダの ファイル名だけ）と「きょうの おはなし」（日がわり）を 出す ───
  //   data/osusume.json に {kind:'resident', id, name, kana, name_en, role, role_en, img, lines:[{ja,en}…]}。lines は 7こ いじょう（いまは 30こ）
  //   どの 文に するかは 日づけだけで きまる（tsuri-daily.js の day()＝みんな おなじ・つぎの 日は かならず ちがう 文）。保存・通信は しない
  const RES_IMG = './', MAX_RES = 3;
  function cleanResidents(list) {
    const out = [];
    if (!Array.isArray(list)) return out;
    for (const e of list.slice(0, 200)) {
      if (!e || typeof e !== 'object' || e.kind !== 'resident' || out.length >= MAX_RES) continue;
      if (!okText(e.name, 40) || !okText(e.name_en, 60) || !okText(e.role, 40) || !okText(e.role_en, 60) || !Array.isArray(e.lines)) continue;
      const lines = e.lines.slice(0, 60).filter(l => l && typeof l === 'object' && okText(l.ja, 80) && okText(l.en, 200)).map(l => ({ ja: l.ja, en: l.en }));
      if (lines.length < 7) continue;
      const img = typeof e.img === 'string' && /^[a-z0-9][a-z0-9_-]{0,40}\.(webp|png|jpg|jpeg)$/i.test(e.img) ? e.img : '';
      const id = typeof e.id === 'string' && /^[a-z0-9_-]{1,20}$/.test(e.id) ? e.id : 'r' + out.length;
      out.push({ id, name: e.name, kana: okText(e.kana, 40) ? e.kana : '', nameEn: e.name_en, role: e.role, roleEn: e.role_en, img, lines });
    }
    return out;
  }
  // ためしの 日づけ：?day=YYYY-MM-DD（手元＝localhost の ときだけ。公開の ページでは きかない）
  const testDay = (() => {
    try {
      if (!/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) return null;
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(new URLSearchParams(location.search).get('day') || '');
      return m ? new Date(+m[1], +m[2] - 1, +m[3], 12) : null;
    } catch (e) { return null; }
  })();
  const dayNum = d => (window.TsuriDaily && typeof window.TsuriDaily.day === 'function') ? window.TsuriDaily.day(d) : d.getFullYear() * 372 + d.getMonth() * 31 + d.getDate();
  // 7 と 30 は わりきれない ので、つづいた 30日で 30この 文が 1かいずつ 出る（つぎの 日は かならず ちがう 文）
  const pickLine = (n, d) => ((dayNum(d || testDay || new Date()) * 7) % n + n) % n;
  const resState = [];
  function paintResident(st) {
    const r = st.r, en = isEn(), n = r.lines.length, i = st.extra ? (pickLine(n) + Math.floor(n / 2)) % n : pickLine(n), line = r.lines[i];
    st.h.textContent = en ? 'Who lives here' : 'へやに いる ひと';
    if (en) st.name.textContent = r.nameEn;
    else { const rb = document.createElement('ruby'); rb.append(r.name); if (r.kana) { const rt = document.createElement('rt'); rt.textContent = r.kana; rb.append(rt); } st.name.replaceChildren(rb); }
    st.role.textContent = en ? r.roleEn : r.role;
    st.label.textContent = en ? (st.extra ? 'One more thing' : 'Today’s words') : (st.extra ? 'もう ひとこと' : 'きょうの おはなし');
    const say = en ? line.en : line.ja;
    if (st.say.textContent !== say) st.say.textContent = say;
    st.say.lang = en ? 'en' : 'ja';
    st.more.textContent = en ? (st.extra ? 'Back to today’s words' : 'One more word, please') : (st.extra ? 'きょうの おはなしに もどる' : 'もう ひとこと きく');
    st.tomorrow.textContent = en ? 'Tomorrow, I’ll have something new to tell you.' : 'あしたも ちがう おはなしを するね。';
    if (st.im) st.im.alt = en ? r.nameEn + ', a girl in a black cap and uniform with a purple ribbon' : r.name + '（' + (r.kana || r.name) + '）。くろい ぼうしと せいふく、むらさきの リボンの おんなの こ';
  }
  function renderResident(r) {
    const sec = document.createElement('section'); sec.className = 'resident'; sec.dataset.enSkip = '1'; sec.dataset.noruby = '';   // ことばは この ページが 自分で きりかえる（tsuri-en.js・ふりがなは さわらない）
    const h = document.createElement('h2'); h.id = 'res-h-' + r.id; sec.setAttribute('aria-labelledby', h.id);
    const box = document.createElement('div'); box.className = 'res-box';
    const st = { r, extra: false, h };
    if (r.img) {
      const fig = document.createElement('figure'); fig.className = 'res-pic';
      const im = new Image(); im.width = 480; im.height = 673; im.decoding = 'async'; im.referrerPolicy = 'no-referrer'; im.onerror = () => { fig.remove(); box.style.gridTemplateColumns = '1fr'; }; im.src = RES_IMG + r.img;
      fig.append(im); box.append(fig); st.im = im;
    }
    const tx = document.createElement('div'); tx.className = 'res-text';
    st.name = document.createElement('h3'); st.name.className = 'res-name';
    st.role = document.createElement('p'); st.role.className = 'res-role';
    st.label = document.createElement('p'); st.label.className = 'res-label'; st.label.id = 'res-l-' + r.id;
    st.say = document.createElement('p'); st.say.className = 'res-say'; st.say.setAttribute('role', 'status'); st.say.setAttribute('aria-live', 'polite');
    st.more = document.createElement('button'); st.more.type = 'button'; st.more.className = 'res-more';
    st.more.addEventListener('click', () => { st.extra = !st.extra; paintResident(st); st.say.classList.remove('fresh'); void st.say.offsetWidth; st.say.classList.add('fresh'); });
    st.tomorrow = document.createElement('p'); st.tomorrow.className = 'res-tomorrow';
    tx.append(st.name, st.role, st.label, st.say, st.more, st.tomorrow); box.append(tx);
    sec.append(h, box);
    resState.push(st); paintResident(st);
    return sec;
  }
  // ─── 棚を えがく（textContent だけ・innerHTML は つかわない）───
  const T = (ja, en) => isEn() ? en : ja;
  const EN_KIND = { illustrator: ['Illustrators', 'People who draw'], streamer: ['Streamers', 'People who stream'], follower: ['Growing creators', 'People who are just getting started'], ganbaru: ['Working hard', 'People who keep going day by day'] };
  function render(list) {
    const data = clean(list), res = cleanResidents(list); shelves.replaceChildren(); resState.length = 0;
    res.forEach(r => shelves.append(renderResident(r)));
    if (!res.length && data.every(d => !d.length)) { const p = document.createElement('p'); p.className = 'empty'; p.textContent = 'いまは じゅんびちゅう。ひろばで まってね。'; const a = document.createElement('a'); a.className = 'home'; a.href = '../index.html'; a.textContent = 'ひろばに もどる'; shelves.append(p, a); }
    KINDS.forEach((K, i) => {
      const sec = document.createElement('section'); sec.className = 'shelf'; sec.dataset.kind = K.k;
      const h = document.createElement('h2'); h.id = 'h-' + K.k; h.textContent = K.h;
      const sub = document.createElement('p'); sub.className = 'sub'; sub.textContent = K.sub;
      sec.setAttribute('aria-labelledby', h.id); sec.append(h, sub);
      if (!data[i].length) { sec.hidden = true; }   // からの たなは かくす（ぜんぶ からの ときは 下の 1こだけ）
      else {
        const row = document.createElement('div'); row.className = 'row'; row.setAttribute('role', 'list');
        data[i].forEach(it => {
          const card = document.createElement('div'); card.className = 'card'; card.setAttribute('role', 'listitem');
          const pic = document.createElement('div'); pic.className = 'pic';
          if (it.img) { const im = new Image(); im.alt = ''; im.width = 140; im.height = 140; im.decoding = 'async'; im.referrerPolicy = 'no-referrer'; im.onerror = () => { im.remove(); const s = document.createElement('span'); s.textContent = K.ic; s.setAttribute('aria-hidden', 'true'); pic.append(s); }; im.src = IMG + it.img; pic.append(im); }
          else { const s = document.createElement('span'); s.textContent = K.ic; s.setAttribute('aria-hidden', 'true'); pic.append(s); }
          const nm = document.createElement('h3'); nm.textContent = it.name; card.append(pic, nm);
          if (it.hito) { const p = document.createElement('p'); p.textContent = it.hito; if (it.hitoEn) p.dataset.en = it.hitoEn; card.append(p); }
          const b = document.createElement('button'); b.type = 'button'; b.dataset.url = it.url; b.dataset.host = it.host; b.dataset.name = it.name; b.textContent = 'ひらく（そとへ）'; b.setAttribute('aria-label', isEn() ? 'Open ' + it.name + ' (goes to another site)' : it.name + 'の ページを ひらく（そとの サイトへ いきます）');
          b.addEventListener('click', () => ask(it, b)); card.append(b); row.append(card);
        });
        sec.append(row);
      }
      const pl = document.createElement('div'); pl.className = 'plank'; pl.setAttribute('aria-hidden', 'true'); sec.append(pl);
      shelves.append(sec);
    });
    applyEn();
  }
  // ─── 外へ ひらく まえの かくにん ───
  let from = null;
  function ask(it, btn) {
    from = btn; where.textContent = 'さき：' + it.host; open.href = it.url; open.setAttribute('aria-label', isEn() ? 'Open ' + it.host : 'ひらく：' + it.host + ' へ');
    if (!dlg.open) dlg.showModal(); cancel.focus(); applyEn();
  }
  cancel.addEventListener('click', () => { dlg.close(); });
  open.addEventListener('click', () => { setTimeout(() => { if (dlg.open) dlg.close(); }, 0); });
  dlg.addEventListener('close', () => { open.removeAttribute('href'); open.href = '#'; if (from && from.isConnected) from.focus(); from = null; });
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
  // ─── English（tsuri-en.js が 英語の ときだけ。ひとりひとりの なまえは そのまま・ひとことは hitokoto_en が あれば それ）───
  function applyEn() {
    resState.forEach(paintResident);   // へやに いる ひとの ことば（日本語でも よぶ：tsuri-en.js が あとから 読みこまれる ため）
    if (!isEn()) return;
    document.querySelectorAll('.card p[data-en]').forEach(p => { p.textContent = p.dataset.en; });
    document.querySelectorAll('.shelf').forEach(s => { const e = EN_KIND[s.dataset.kind]; if (e) { s.querySelector('h2').textContent = e[0]; s.querySelector('.sub').textContent = e[1]; } });
  }
  const loadData = async () => {
    let list = [];
    try { const r = await fetch(DATA, { cache: 'no-store' }); if (r.ok) list = await r.json(); } catch (e) { list = []; }
    render(list);
  };
  window.Osusume = { render, clean, cleanUrl, cleanResidents, pickLine, kinds: KINDS.map(k => k.k), ask: (it) => ask(it, null), reload: loadData };
  loadData();   // 中身が とどく まえに「じゅんびちゅう」を 出さない（へやに いる ひとが いる とき 一しゅん まちがった 文が 見える）
  document.addEventListener('DOMContentLoaded', () => resState.forEach(paintResident));
  window.addEventListener('load', () => setTimeout(applyEn, 400));
})();
</script>
