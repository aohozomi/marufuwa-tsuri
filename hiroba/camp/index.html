<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>キャンプば｜まるふわの ひろば</title>
<meta property="og:type" content="website">
<meta property="og:title" content="キャンプば｜まるふわの ひろば">
<meta property="og:url" content="https://aohozomi.github.io/marufuwa-tsuri/hiroba/camp/">
<meta property="og:image" content="https://aohozomi.github.io/marufuwa-tsuri/og-v3.jpg">

<meta name="description" content="まるふわと なかまが、よるの キャンプで たきびを かこんで います。さわると、たきびが ぱちっ。マシュマロが こんがり。てんすう・じかんは ありません。">
<meta name="theme-color" content="#141c3e">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%232a3a66'/%3E%3Ctext x='50' y='70' font-size='62' text-anchor='middle'%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E">
<script>
// キャンプばは いつでも よる。「もじを おおきく」「うごきを へらす」だけ 本体の きろく marufuwa-tsuri-v1 から 読む（書かない）。
try {
  var early = JSON.parse(localStorage.getItem('marufuwa-tsuri-v1')) || {}, root = document.documentElement;
  if (early.large === true) root.dataset.large = 'true';
  if (early.calm === true) root.dataset.calm = 'true';
} catch (e) {}
document.documentElement.dataset.time = 'n';
</script>
<style>
:root{--ink:#2a2430;--ink2:#4a4358;--plate:#fffaf0;--line:#d9b27a;--btn1:#fff6e3;--btn2:#ffd9a8;--btn-line:#d99a55;--link:#7a3a14;--fire:#ffb347}
:root[data-large=true]{font-size:125%}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans JP",system-ui,sans-serif;line-height:1.7;padding:12px 12px 36px;
  background:radial-gradient(1.5px 1.5px at 12% 10%,#fffd 0 60%,#0000),radial-gradient(1.5px 1.5px at 34% 6%,#fffc 0 60%,#0000),radial-gradient(2px 2px at 58% 14%,#fffd 0 60%,#0000),radial-gradient(1.5px 1.5px at 78% 7%,#fffc 0 60%,#0000),radial-gradient(2px 2px at 91% 20%,#fffd 0 60%,#0000),radial-gradient(1.5px 1.5px at 22% 24%,#fffb 0 60%,#0000),linear-gradient(#141c3e,#2a3a66 60%,#1d3326);background-color:#1c2750}
:root[data-inapp=x] body{padding-bottom:84px}
.room{max-width:760px;margin:0 auto}
.back{display:inline-flex;align-items:center;min-height:44px;min-width:44px;padding:4px 14px;border-radius:22px;background:linear-gradient(var(--btn1),var(--btn2));border:2px solid var(--btn-line);color:var(--link);font-weight:800;text-decoration:none}
h1{margin:8px 0 2px;font-size:1.45rem;line-height:1.4;color:#fff6e3}
.lead{margin:2px 0 10px;font-size:.95rem;color:#f1e9ff}
.scene{position:relative;width:100%;aspect-ratio:4/3;border-radius:20px;overflow:hidden;border:3px solid #6b5a8a;box-shadow:0 8px 24px #0006;background:#141c3e}
.scene>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ch,.prop{position:absolute;display:block;padding:0;margin:0;border:0;background:none;-webkit-tap-highlight-color:transparent}
.ch{cursor:pointer;transform-origin:50% 100%}
.ch img,.prop img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
/* さわれる なかま・たきび・マシュマロは 44px いじょうの おおきさに（えの おおきさは そのまま） */
.scene{container-type:inline-size}
button.ch,button.prop{display:flex;align-items:flex-start;justify-content:center;min-width:44px;min-height:44px}
button.prop[hidden]{display:none}
#c-neko img{width:13cqw}#c-maru img{width:15cqw}#c-usagi img{width:11cqw}#p-fire img{width:13cqw}#p-marsh img{width:9cqw}
/* ボタンが えより ひろく なった ぶん、ひだりへ ずらして えの いちを もとの まま に */
#c-neko{margin-left:min(0px,calc((13cqw - 44px) / 2))}#c-maru{margin-left:min(0px,calc((15cqw - 44px) / 2))}#c-usagi{margin-left:min(0px,calc((11cqw - 44px) / 2))}#p-fire{margin-left:min(0px,calc((13cqw - 44px) / 2))}#p-marsh{margin-left:min(0px,calc((9cqw - 44px) / 2))}
#c-neko{left:25%;top:38%;width:13%}
#c-maru{left:57%;top:33%;width:15%}
#c-usagi{left:73%;top:39%;width:11%}
.prop[hidden]{display:none}
#p-tent{left:2%;top:34%;width:22%}
#p-fire{left:42%;top:40%;width:13%;cursor:pointer}
#p-log{left:27%;top:49%;width:46%}
#p-marsh{left:51%;top:45%;width:9%;cursor:pointer}
.glow{position:absolute;left:33%;top:34%;width:32%;height:44%;background:radial-gradient(closest-side,#ffb34799,#ffb34700);opacity:.8;transition:opacity .25s;pointer-events:none}
.fire-pop .glow{opacity:1}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffd27a;animation:rise 1.1s ease-out forwards;pointer-events:none}
@keyframes rise{from{opacity:.95;transform:translateY(0)}to{opacity:0;transform:translateY(-46px)}}
.talk{transform:scale(1.06)}
.wait{margin:10px 0;padding:10px 14px;border-radius:16px;background:var(--plate);border:2px solid var(--line);font-weight:700}
.ready-only[hidden]{display:none}
#p-marsh{transition:transform .5s,filter .8s}
.marsh-near #p-marsh{transform:translate(-4.5%,-6%)}
.marsh-toast #p-marsh img{filter:sepia(.85) saturate(1.6) brightness(.9)}
.marsh-gone #p-marsh{opacity:0}
@media(prefers-reduced-motion:reduce){.spark{animation:none!important}*{transition:none!important}}
:root[data-calm=true] .spark{animation:none!important}
:root[data-calm=true] *{transition:none!important}
.say{margin:10px 0 8px;min-height:3.4em;padding:8px 14px;border-radius:16px;background:var(--plate);border:2px solid var(--line);font-size:1rem;font-weight:700;color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts button{flex:1 1 150px;min-height:48px;min-width:44px;padding:6px 14px;border-radius:24px;border:2px solid var(--btn-line);background:linear-gradient(var(--btn1),var(--btn2));color:var(--link);font:inherit;font-weight:800;cursor:pointer}
.acts button:active{transform:translateY(1px)}
button:focus-visible,.back:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #fff;outline-offset:2px;box-shadow:0 0 0 6px #17658a}
.more{margin:14px 0 0}
.more summary{display:inline-flex;align-items:center;min-height:44px;padding:4px 16px;border-radius:22px;border:2px solid var(--btn-line);background:linear-gradient(var(--btn1),var(--btn2));color:var(--link);font-weight:800;cursor:pointer;list-style:none}
.more summary::-webkit-details-marker{display:none}
.note{margin:8px 0 0;padding:8px 12px;border-radius:14px;background:var(--plate);border:2px solid var(--line);font-size:.88rem;color:var(--ink2)}
.note a{color:var(--link)}
.anshin-link{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;margin:6px 0 0;padding:6px 18px;border-radius:22px;border:2px solid var(--btn-line,#9bc9da);background:linear-gradient(var(--btn1,#fff),var(--btn2,#dff1f7));color:var(--link,#14506b)!important;font-weight:800;text-decoration:none}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<main class="room" id="room">
  <a class="back" id="back" href="../index.html">← ひろば</a>
  <h1>キャンプば</h1>
  <p class="lead">よるの キャンプ。ゆっくり していってね。</p>
  <div class="scene" id="scene">
    <img class="bg" src="../../img/bg/tsuri_L_yoru.webp" alt="" decoding="async">
    <div class="glow" id="glow" hidden></div>
    <div class="prop" id="p-tent" hidden><img alt="" src=""></div>
    <div class="prop" id="p-log" hidden><img alt="" src=""></div>
    <button class="ch" id="c-neko" type="button" tabindex="-1" aria-hidden="true" aria-label="ねこ"><img alt="" src="../../img/friend-neko-s.webp"></button>
    <button class="ch" id="c-maru" type="button" tabindex="-1" aria-hidden="true" aria-label="まるふわ"><img alt="" src="../../img/game-blue.webp"></button>
    <button class="ch" id="c-usagi" type="button" tabindex="-1" aria-hidden="true" aria-label="うさぎ"><img alt="" src="../../img/friend-usagi-s.webp"></button>
    <button class="prop" id="p-fire" type="button" tabindex="-1" aria-hidden="true" aria-label="たきび" hidden><img alt="" src=""></button>
    <button class="prop" id="p-marsh" type="button" tabindex="-1" aria-hidden="true" aria-label="マシュマロ" hidden><img alt="" src=""></button>
  </div>
  <p class="wait" id="wait">キャンプの じゅんびを しているよ。もうすこし まってね。</p>
  <p class="say ready-only" id="say" role="status" aria-live="polite" hidden>たきびが、ぱち ぱち。ゆっくり していってね。</p>
  <div class="acts ready-only" id="acts" hidden>
    <button type="button" id="b-fire">🔥 たきびに さわる</button>
    <button type="button" id="b-marsh">🍡 マシュマロを やく</button>
    <button type="button" id="b-talk">💬 なかまと はなす</button>
  </div>
  <details class="more"><summary>おうちの かたへ</summary><p class="note" id="note">ここは、のんびり すごすための ばしょです。てんすう・じかん・ランキングは ありません。さわっても、なにも へらず、しっぱいも ありません。うごきを へらす せっていでは、ひのこを だしません。<a class="anshin-link" href="../../anshin/">おうちの かたへ</a></p></details>
</main>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const isEn = () => !!(window.TsuriEn && window.TsuriEn.lang === 'en');
  const L = (ja, en) => isEn() ? en : ja;
  const calm = () => document.documentElement.dataset.calm === 'true' || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const say = $('say'), scene = $('scene');
  const LINES = [
    ['まつ じかんも、おいしいね', 'Even the waiting is yummy.'],
    ['ほしが きれいだね', 'The stars are lovely.'],
    ['あったかいね', 'It’s so warm.'],
    ['ゆっくりで いいよ', 'Slow is just fine.'],
    ['また いつでも', 'Come back anytime.']
  ];
  let li = Math.floor(Math.random() * LINES.length), speaker = 1;
  const setSay = (ja, en) => { say.textContent = L(ja, en); };
  // ちいさな ぱちっ（低め・みじかい。つりびよりの「おと」を きって いたら ならさない）
  let ac = null;
  function pop() {
    try {
      const st = JSON.parse(localStorage.getItem('marufuwa-tsuri-v1')) || {}; if (st.sound === false) return;
      ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume();
      const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(240, t); o.frequency.exponentialRampToValueAtTime(110, t + .07);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.09, t + .005); g.gain.exponentialRampToValueAtTime(.0001, t + .09);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + .1);
    } catch (e) {}
  }
  const popFire = () => {
    pop();
    scene.classList.add('fire-pop'); setTimeout(() => scene.classList.remove('fire-pop'), 450);
    if (!calm()) {
      for (let i = 0; i < 5; i++) {
        const c = document.createElement('i'); c.className = 'spark';
        c.style.left = (46 + Math.random() * 8).toFixed(1) + '%'; c.style.top = (40 + Math.random() * 6).toFixed(1) + '%';
        scene.append(c); setTimeout(() => c.remove(), 1200);
      }
    }
    setSay('ぱちっ。あったかいね', 'Pop! So warm.');
  };
  // マシュマロ：0=ぼうの さき（しろい）→1=たきびに かざす（こんがり）→2=ぱくっ→0。やけすぎ・しっぱいは ない
  let ms = 0, msTimer = 0;
  function reset() { clearTimeout(msTimer); ms = 0; scene.classList.remove('marsh-near', 'marsh-toast', 'marsh-gone'); }
  function marsh() {
    clearTimeout(msTimer);
    if (ms === 0) { ms = 1; scene.classList.add('marsh-near', 'marsh-toast'); setSay('こんがり。いい においが するね。もういちど さわると、たべられるよ', 'Golden brown. Smells so good. Touch again to eat it.'); }
    else if (ms === 1) { ms = 2; scene.classList.add('marsh-gone'); setSay('ぱくっ。あまくて おいしいね', 'Munch! Sweet and yummy.'); msTimer = setTimeout(reset, 1600); }
    else reset();
  }
  const CH = ['c-neko', 'c-maru', 'c-usagi'];
  function talk(who) {
    CH.forEach(i => $(i).classList.remove('talk'));
    speaker = typeof who === 'number' ? who : (speaker + 1) % 3;
    $(CH[speaker]).classList.add('talk');
    const l = LINES[li % LINES.length]; li++;
    setSay(l[0], l[1]);
  }
  $('b-fire').addEventListener('click', popFire); $('p-fire').addEventListener('click', popFire);
  $('b-marsh').addEventListener('click', marsh); $('p-marsh').addEventListener('click', marsh);
  $('b-talk').addEventListener('click', () => talk());
  CH.forEach((id, i) => $(id).addEventListener('click', () => talk(i)));
  // 天の 絵（img/camp/ に 置く）：テント・たきび・まるた・マシュマロの 4まいが そろったら ひらく。仮の 絵は つかわない。
  const PROPS = { tent: 'p-tent', fire: 'p-fire', log: 'p-log', marsh: 'p-marsh' };
  let got = 0; const need = Object.keys(PROPS).length;
  Object.keys(PROPS).forEach(k => {
    const im = new Image(); im.onload = () => {
      const el = $(PROPS[k]); el.querySelector('img').src = im.src; el.dataset.ok = '1';
      if (++got === need) {
        Object.values(PROPS).forEach(id => { $(id).hidden = false; });
        $('glow').hidden = false; $('wait').hidden = true; say.hidden = false; $('acts').hidden = false;
        document.documentElement.dataset.ready = '1'; setSay('たきびが、ぱち ぱち。ゆっくり していってね。', 'The fire goes crackle, crackle. Take your time.');
      }
    };
    im.src = '../../img/camp/' + k + '.webp';
  });
  // English
  const EX = {
    'キャンプば｜まるふわの ひろば': 'Campsite | Marufuwa Plaza', 'キャンプば': 'Campsite', '← ひろば': '← Plaza',
    'よるの キャンプ。ゆっくり していってね。': 'A night at the campsite. Take your time.',
    'キャンプの じゅんびを しているよ。もうすこし まってね。': 'We are getting the campsite ready. Please wait a little.',
    '🔥 たきびに さわる': '🔥 Touch the fire', '🍡 マシュマロを やく': '🍡 Toast a marshmallow', '💬 なかまと はなす': '💬 Talk with friends',
    'おうちの かたへ': 'For grown-ups', 'ねこ': 'Cat', 'まるふわ': 'Marufuwa', 'うさぎ': 'Bunny', 'たきび': 'Campfire', 'マシュマロ': 'Marshmallow',
    'ここは、のんびり すごすための ばしょです。てんすう・じかん・ランキングは ありません。さわっても、なにも へらず、しっぱいも ありません。うごきを へらす せっていでは、ひのこを だしません。': 'This is a place to relax. There are no scores, timers or rankings. Nothing is lost by touching, and nothing can go wrong. With “less motion” turned on, sparks are not shown.'
  };
  const reg = () => { const E = window.TsuriEn; if (E && E.lang === 'en' && typeof E.add === 'function' && !reg.done) { reg.done = true; E.add({ ex: EX }); } };
  const title = () => { if (isEn()) document.title = 'Campsite | Marufuwa Plaza'; };
  document.addEventListener('DOMContentLoaded', () => { reg(); title(); setTimeout(title, 300); });
  addEventListener('load', () => { reg(); title(); });
  window.Camp = { fire: popFire, marsh, talk, state: () => ({ ms, speaker, ready: document.documentElement.dataset.ready === '1' }), lines: LINES.length };
})();
</script>
<script src="../../tsuri-town.js"></script>
<script defer src="../../tsuri-bgm.js"></script>
<script defer src="../../tsuri-pagesound.js"></script>
<script defer src="../../tsuri-en.js"></script>
<script defer src="../../tsuri-en-hiroba.js"></script>
<script defer src="../../tsuri-ruby-dict.js"></script>
<script defer src="../../tsuri-ruby.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => { if (window.PageSound) PageSound.init({ tap: true, mount: document.getElementById('back'), bgm: 'camp', time: () => 'n' }); });</script>
</body>
</html>
